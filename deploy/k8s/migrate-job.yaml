apiVersion: batch/v1
kind: Job
metadata:
  name: beacon-migrate
  namespace: beacon
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 1
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: migrate
          image: ghcr.io/OWNER/projectbeacon-web:__PINNED_TAG__
          securityContext:
            runAsNonRoot: true
            runAsUser: 1654
            runAsGroup: 1654
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          envFrom:
            - secretRef:
                name: beacon-web
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: BEACON_MIGRATE_ON_START
              value: "true"
            - name: BEACON_MIGRATE_THEN_EXIT
              value: "true"
