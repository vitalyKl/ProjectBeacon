apiVersion: apps/v1
kind: Deployment
metadata:
  name: beacon-web-blue
  namespace: beacon
  labels:
    app: beacon-web
    color: blue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: beacon-web
      color: blue
  template:
    metadata:
      labels:
        app: beacon-web
        color: blue
    spec:
      containers:
        - name: web
          image: ghcr.io/OWNER/projectbeacon-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - secretRef:
                name: beacon-web
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: BEACON_MIGRATE_ON_START
              value: "false"
            - name: BEACON_GIT_SHA
              value: unknown
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 15"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
      terminationGracePeriodSeconds: 45
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beacon-web-green
  namespace: beacon
  labels:
    app: beacon-web
    color: green
spec:
  replicas: 0
  selector:
    matchLabels:
      app: beacon-web
      color: green
  template:
    metadata:
      labels:
        app: beacon-web
        color: green
    spec:
      containers:
        - name: web
          image: ghcr.io/OWNER/projectbeacon-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - secretRef:
                name: beacon-web
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: BEACON_MIGRATE_ON_START
              value: "false"
            - name: BEACON_GIT_SHA
              value: unknown
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 15"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
      terminationGracePeriodSeconds: 45
---
apiVersion: v1
kind: Service
metadata:
  name: beacon-web
  namespace: beacon
spec:
  selector:
    app: beacon-web
    color: blue
  ports:
    - name: http
      port: 80
      targetPort: http
