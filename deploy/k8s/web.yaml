apiVersion: apps/v1
kind: Deployment
metadata:
  name: beacon-web-blue
  namespace: beacon
  labels:
    app: beacon-web
    color: blue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: beacon-web
      color: blue
  template:
    metadata:
      labels:
        app: beacon-web
        color: blue
    spec:
      automountServiceAccountToken: false
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: web
          image: ghcr.io/OWNER/projectbeacon-web:__PINNED_TAG__
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 1654
            runAsGroup: 1654
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - secretRef:
                name: beacon-web
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: BEACON_MIGRATE_ON_START
              value: "false"
            - name: BEACON_GIT_SHA
              value: unknown
            # TLS terminates at the ingress. Set the ingress pod CIDR so the app
            # trusts X-Forwarded-Proto/For (Secure cookies, rate-limit keying).
            # - name: FORWARDEDHEADERS__KNOWNNETWORKS__0
            #   value: "10.244.0.0/16"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 15"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
      terminationGracePeriodSeconds: 45
---
