name: Cleanup merged PR branches

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    if: github.repository == 'vitalyKl/ProjectBeacon'
    runs-on: ubuntu-latest
    steps:
      - name: Delete source branches of merged pull requests
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const repository = `${owner}/${repo}`;
            const [closedPulls, openPulls] = await Promise.all([
              github.paginate(github.rest.pulls.list, {
                owner, repo, state: "closed", per_page: 100
              }),
              github.paginate(github.rest.pulls.list, {
                owner, repo, state: "open", per_page: 100
              })
            ]);

            const activeBranches = new Set(
              openPulls
                .filter(pr => pr.head.repo?.full_name === repository)
                .map(pr => pr.head.ref)
            );

            const mergedBranches = [...new Set(
              closedPulls
                .filter(pr =>
                  pr.merged_at &&
                  pr.base.ref === "main" &&
                  pr.head.repo?.full_name === repository &&
                  pr.head.ref &&
                  pr.head.ref !== context.payload.repository.default_branch &&
                  !activeBranches.has(pr.head.ref))
                .map(pr => pr.head.ref)
            )];

            for (const branch of mergedBranches) {
              try {
                const current = await github.rest.repos.getBranch({ owner, repo, branch });
                if (current.data.protected) {
                  core.info(`Keeping protected branch ${branch}`);
                  continue;
                }

                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `heads/${branch}`
                });
                core.info(`Deleted merged PR branch ${branch}`);
              } catch (error) {
                if (error.status === 404) {
                  core.info(`Branch ${branch} is already absent`);
                  continue;
                }
                throw error;
              }
            }
