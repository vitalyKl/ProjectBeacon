name: Generate harness token migration

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  generate:
    if: github.event.pull_request.head.ref == 'feature/native-agent-harness' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.402
      - name: Restore dependencies
        run: dotnet restore ProjectBeacon.sln
      - name: Restore EF tool
        run: dotnet tool restore
      - name: Generate migration using EF
        run: dotnet ef migrations add AddHarnessApiTokenBindings --project ProjectBeacon.Infrastructure --startup-project ProjectBeacon.Infrastructure
      - name: Commit generated migration and model snapshot
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ProjectBeacon.Infrastructure/Data/Migrations
          if git diff --cached --quiet; then
            echo "EF did not produce any migration changes."
            exit 1
          fi
          git commit -m "ef: add harness API token bindings migration"
          git push origin "HEAD:${BRANCH_NAME}"
