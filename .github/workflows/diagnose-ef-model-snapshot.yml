name: Diagnose EF model snapshot

on:
  push:
    branches:
      - feat/saas-audit-completion

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.402
      - name: Restore dotnet tools
        run: dotnet tool restore
      - name: Restore solution
        run: dotnet restore ProjectBeacon.sln
      - name: Regenerate current model snapshot
        run: |
          dotnet ef migrations add DiagnoseEmailModelDelta --project ProjectBeacon.Infrastructure --startup-project ProjectBeacon.Infrastructure
          echo "===== GENERATED SNAPSHOT START ====="
          cat ProjectBeacon.Infrastructure/Data/Migrations/BeaconDbContextModelSnapshot.cs
          echo "===== GENERATED SNAPSHOT END ====="
          echo "===== GENERATED DESIGNER START ====="
          find ProjectBeacon.Infrastructure/Data/Migrations -maxdepth 1 -name '*DiagnoseEmailModelDelta.Designer.cs' -exec cat {} \;
          echo "===== GENERATED DESIGNER END ====="
