name: Diagnose EF model delta

on:
  push:
    branches:
      - feat/saas-audit-completion

permissions:
  contents: read

jobs:
  model-delta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.402
      - name: Restore dotnet tools
        run: dotnet tool restore
      - name: Restore solution
        run: dotnet restore ProjectBeacon.sln
      - name: Generate the pending model delta
        run: |
          dotnet ef migrations add DiagnoseEmailModelDelta --project ProjectBeacon.Infrastructure --startup-project ProjectBeacon.Infrastructure
          echo "===== GENERATED MIGRATION ====="
          find ProjectBeacon.Infrastructure/Data/Migrations -maxdepth 1 -name '*DiagnoseEmailModelDelta.cs' -print -exec sed -n '1,260p' {} \;
          echo "===== SNAPSHOT DELTA ====="
          git diff -- ProjectBeacon.Infrastructure/Data/Migrations/BeaconDbContextModelSnapshot.cs
