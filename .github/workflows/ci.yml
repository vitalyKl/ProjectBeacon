name: CI

on:
  # Keep main protected by an automatic check after every merge.
  push:
    branches: [main]
  # Do not run on "synchronize": commits pushed to an existing PR are
  # accumulated until the author explicitly requests a fresh CI run.
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review]
  # Run the full matrix on demand from Actions -> CI -> Run workflow.
  workflow_dispatch:

# Avoid overlapping runs for the same PR/branch; keep the newest requested run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test-linux:
    timeout-minutes: 30
    # Authoritative Postgres/test lane. The `tests` job in release.yml mirrors
    # this job verbatim (tag pushes do not trigger this workflow) — keep the
    # SDK pin, services, test command, and TRX guards in sync on any change.
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: beacon
      TESTINGPLATFORM_TELEMETRY_OPTOUT: "1"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: beacon
          POSTGRES_PASSWORD: beacon
          POSTGRES_DB: beacon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U beacon"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          # GHA images preinstall 10.0.401, whose dotnet test does not recognize
          # --results-directory-layout and forwards it to the MTP host, which
          # rejects it: every module exits 5 with "Zero tests ran". 10.0.402
          # recognizes the option (global.json rollForward then selects it).
          dotnet-version: 10.0.402
      - name: Export test DB URL
        shell: bash
        run: echo "BEACON_TEST_DATABASE_URL=postgres://beacon:beacon@localhost:5432/beacon" >> "$GITHUB_ENV"
      - name: Restore dependencies
        run: dotnet restore ProjectBeacon.sln
      - name: Build
        run: dotnet build ProjectBeacon.sln --no-restore
      - name: No pending model changes
        run: |
          # Release compiler/MSBuild server memory before starting EF design-time services.
          dotnet build-server shutdown
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project ProjectBeacon.Infrastructure --startup-project ProjectBeacon.Infrastructure
      - name: Test — API
        if: always()
        timeout-minutes: 8
        run: dotnet test ProjectBeacon.API.Tests/ProjectBeacon.API.Tests.csproj --no-build --results-directory TestResults/ProjectBeacon.API.Tests --report-xunit-trx --report-xunit-trx-filename test-results.trx -p:TestingPlatformCaptureOutput=false
      - name: Test — Application
        if: always()
        timeout-minutes: 8
        run: dotnet test ProjectBeacon.Application.Tests/ProjectBeacon.Application.Tests.csproj --no-build --results-directory TestResults/ProjectBeacon.Application.Tests --report-xunit-trx --report-xunit-trx-filename test-results.trx -p:TestingPlatformCaptureOutput=false
      - name: Test — CLI
        if: always()
        timeout-minutes: 8
        run: |
          mkdir -p TestResults/ProjectBeacon.Cli.Tests
          dotnet ProjectBeacon.Cli.Tests/bin/Debug/net9.0/ProjectBeacon.Cli.Tests.dll ProjectBeacon.Cli.Tests/testconfig.json -longRunning 30 -diagnostics -internalDiagnostics -showLiveOutput -trait- "Lane=Gpu" -trx TestResults/ProjectBeacon.Cli.Tests/test-results.trx
      - name: Test — Domain
        if: always()
        timeout-minutes: 8
        run: dotnet test ProjectBeacon.Domain.Tests/ProjectBeacon.Domain.Tests.csproj --no-build --results-directory TestResults/ProjectBeacon.Domain.Tests --report-xunit-trx --report-xunit-trx-filename test-results.trx -p:TestingPlatformCaptureOutput=false
      - name: Test — Infrastructure
        if: always()
        timeout-minutes: 8
        run: dotnet test ProjectBeacon.Infrastructure.Tests/ProjectBeacon.Infrastructure.Tests.csproj --no-build --results-directory TestResults/ProjectBeacon.Infrastructure.Tests --report-xunit-trx --report-xunit-trx-filename test-results.trx -p:TestingPlatformCaptureOutput=false
      - name: Test — Web
        if: always()
        timeout-minutes: 8
        run: dotnet test ProjectBeacon.Web.Tests/ProjectBeacon.Web.Tests.csproj --no-build --results-directory TestResults/ProjectBeacon.Web.Tests --report-xunit-trx --report-xunit-trx-filename test-results.trx -p:TestingPlatformCaptureOutput=false
      - name: Test — Worker
        if: always()
        timeout-minutes: 8
        run: dotnet test ProjectBeacon.Worker.Tests/ProjectBeacon.Worker.Tests.csproj --no-build --results-directory TestResults/ProjectBeacon.Worker.Tests --report-xunit-trx --report-xunit-trx-filename test-results.trx -p:TestingPlatformCaptureOutput=false
      - name: Report failed test details from TRX
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          failures = 0
          for path in sorted(glob.glob("TestResults/**/*.trx", recursive=True)):
              root = ET.parse(path).getroot()
              for result in root.iter():
                  if not result.tag.endswith("UnitTestResult") or result.get("outcome") != "Failed":
                      continue
                  failures += 1
                  name = result.get("testName", "<unknown test>")
                  print(f"::group::FAILED TEST: {name} ({path})")
                  for node in result.iter():
                      tag = node.tag.rsplit("}", 1)[-1]
                      if tag in ("Message", "StackTrace") and node.text:
                          print(f"{tag}:\\n{node.text}")
                  print("::endgroup::")
          if failures == 0:
              print("No failed tests found in TRX reports.")
          PY
      - name: Verify test results (TRX guards)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          BASE = "TestResults"
          EXPECTED_MODULES = 7
          # Exact current total across the 7 modules; bump when tests are added.
          MIN_TOTAL = 1523
          # The only tests allowed to be NotExecuted on Linux: platform-conditional
          # skips that cannot execute there. Anything else (e.g. a Postgres opt-out
          # leaking into this authoritative lane) fails the guard.
          EXPECTED_NOT_EXECUTED = {
              # mklink /J junctions exist only on Windows; RequireJunctionSupport()
              # skips this test on non-Windows platforms.
              "ProjectBeacon.Application.Tests.WorkspacePathTests.ResolveInsideRoot_RejectsMklinkJunction",
          }

          def unit_test_results(path):
              tree = ET.parse(path)
              return [r for r in tree.iter() if r.tag.endswith("UnitTestResult")]

          paths = sorted(glob.glob(BASE + "/**/test-results.trx", recursive=True))
          if len(paths) != EXPECTED_MODULES:
              raise SystemExit(f"::error::Expected {EXPECTED_MODULES} per-module TRX reports under {BASE}, found {len(paths)}: {paths}")

          app_trx = [p for p in paths if "ProjectBeacon.Application.Tests" in p]
          if not app_trx:
              raise SystemExit("::error::Application.Tests TRX report not found")
          app = {r.get("testName"): r.get("outcome") for r in unit_test_results(app_trx[0])}
          for t in (
              "ProjectBeacon.Application.Tests.WorkspacePathTests.ResolveInsideRoot_RejectsSymlinkDirectory_Escape",
              "ProjectBeacon.Application.Tests.WorkspacePathTests.ResolveInsideRoot_RejectsDirectoryJunction",
          ):
              outcome = app.get(t)
              if outcome != "Passed":
                  raise SystemExit(f"::error::Symlink security test {t} did not run to Passed (outcome={outcome!r}); the path-escape gate is inactive")

          total = 0
          skipped = []
          for path in paths:
              for r in unit_test_results(path):
                  total += 1
                  if r.get("outcome") == "NotExecuted":
                      skipped.append(r.get("testName"))
          if total < MIN_TOTAL:
              raise SystemExit(f"::error::Only {total} test results reported; expected at least {MIN_TOTAL}")
          unexpected = sorted(set(skipped) - EXPECTED_NOT_EXECUTED)
          if unexpected:
              raise SystemExit("::error::Unexpected tests NotExecuted on Linux (only platform-conditional skips are allowed):\\n" + "\\n".join(unexpected))
          print(f"OK: {total} results, {len(skipped)} platform-conditional skips, {len(paths)} modules, symlink gates Passed")
          PY
      - name: Verify formatting
        run: dotnet format ProjectBeacon.sln --verify-no-changes --exclude-diagnostics xUnit1051

  build-test:
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      TESTINGPLATFORM_TELEMETRY_OPTOUT: "1"
      # The Testcontainers fallback is unreliable on shared GHA egress IPs
      # (observed: "No such image: postgres:16-alpine" -> all 35 Postgres tests
      # failed on both matrix lanes). Linux is the authoritative Postgres lane
      # (service container + TRX guards); windows/macos opt out explicitly, so
      # the Postgres tests report a genuine "Skipped" with a reason.
      BEACON_TEST_SKIP_POSTGRES: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          # Same pin as the Linux job: one SDK version across all CI jobs.
          dotnet-version: 10.0.402
      - name: Restore dependencies
        run: dotnet restore ProjectBeacon.sln
      - name: Build
        run: dotnet build ProjectBeacon.sln --no-restore
      - name: No pending model changes
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project ProjectBeacon.Infrastructure --startup-project ProjectBeacon.Infrastructure
      # No postgres service container: services are Linux-runner-only, and the
      # Testcontainers fallback is unreliable on shared GHA egress IPs, so the
      # matrix lanes run with BEACON_TEST_SKIP_POSTGRES=1 (reported skips).
      - name: Test — API
        if: always()
        timeout-minutes: 8
        run: dotnet test ProjectBeacon.API.Tests/ProjectBeacon.API.Tests.csproj --no-build -p:TestingPlatformCaptureOutput=false
      - name: Test — Application
        if: always()
        timeout-minutes: 8
        run: dotnet test ProjectBeacon.Application.Tests/ProjectBeacon.Application.Tests.csproj --no-build -p:TestingPlatformCaptureOutput=false
      - name: Test — CLI
        if: always()
        timeout-minutes: 8
        run: dotnet ProjectBeacon.Cli.Tests/bin/Debug/net9.0/ProjectBeacon.Cli.Tests.dll ProjectBeacon.Cli.Tests/testconfig.json -longRunning 30 -diagnostics -internalDiagnostics -showLiveOutput -trait- "Lane=Gpu"
      - name: Test — Domain
        if: always()
        timeout-minutes: 8
        run: dotnet test ProjectBeacon.Domain.Tests/ProjectBeacon.Domain.Tests.csproj --no-build -p:TestingPlatformCaptureOutput=false
      - name: Test — Infrastructure
        if: always()
        timeout-minutes: 8
        run: dotnet test ProjectBeacon.Infrastructure.Tests/ProjectBeacon.Infrastructure.Tests.csproj --no-build -p:TestingPlatformCaptureOutput=false
      - name: Test — Web
        if: always()
        timeout-minutes: 8
        run: dotnet test ProjectBeacon.Web.Tests/ProjectBeacon.Web.Tests.csproj --no-build -p:TestingPlatformCaptureOutput=false
      - name: Test — Worker
        if: always()
        timeout-minutes: 8
        run: dotnet test ProjectBeacon.Worker.Tests/ProjectBeacon.Worker.Tests.csproj --no-build -p:TestingPlatformCaptureOutput=false
      - name: Verify formatting
        run: dotnet format ProjectBeacon.sln --verify-no-changes --exclude-diagnostics xUnit1051
