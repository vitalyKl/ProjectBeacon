name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test-linux:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: beacon
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: beacon
          POSTGRES_PASSWORD: beacon
          POSTGRES_DB: beacon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U beacon"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Export test DB URL
        shell: bash
        run: echo "BEACON_TEST_DATABASE_URL=postgres://beacon:beacon@localhost:5432/beacon" >> "$GITHUB_ENV"
      - name: Restore dependencies
        run: dotnet restore ProjectBeacon.sln
      - name: Build
        run: dotnet build ProjectBeacon.sln --no-restore
      - name: No pending model changes
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project ProjectBeacon.Infrastructure --startup-project ProjectBeacon.Infrastructure
      - name: Test
        run: dotnet test ProjectBeacon.sln --no-build --verbosity normal --filter "Lane!=Gpu"
      - name: Verify formatting
        run: dotnet format ProjectBeacon.sln --verify-no-changes
      - name: Symlink security tests must run
        run: |
          set -euo pipefail
          out=$(dotnet test ProjectBeacon.Application.Tests --no-build --verbosity normal \
                --filter "FullyQualifiedName~WorkspacePathTests.ResolveInsideRoot_RejectsSymlinkDirectory_Escape|FullyQualifiedName~WorkspacePathTests.ResolveInsideRoot_RejectsDirectoryJunction") || { echo "$out"; exit 1; }
          echo "$out"
          for t in ResolveInsideRoot_RejectsSymlinkDirectory_Escape ResolveInsideRoot_RejectsDirectoryJunction; do
            if ! printf '%s\n' "$out" | grep -q "$t"; then
              echo "::error::Symlink security test $t was not selected by the filter"
              exit 1
            fi
          done
          for t in ResolveInsideRoot_RejectsSymlinkDirectory_Escape ResolveInsideRoot_RejectsDirectoryJunction; do
            if printf '%s\n' "$out" | grep -qF "$t [SKIP]"; then
              echo "::error::Symlink security test $t was skipped on Linux; the control-plane path escape gate is inactive"
              exit 1
            fi
          done

  build-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      POSTGRES_PASSWORD: beacon
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore dependencies
        run: dotnet restore ProjectBeacon.sln
      - name: Build
        run: dotnet build ProjectBeacon.sln --no-restore
      - name: No pending model changes
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project ProjectBeacon.Infrastructure --startup-project ProjectBeacon.Infrastructure
      - name: Test
        run: dotnet test ProjectBeacon.sln --no-build --verbosity normal --filter "Lane!=Gpu"
      - name: Verify formatting
        run: dotnet format ProjectBeacon.sln --verify-no-changes
